services:
  app:
    restart: unless-stopped
    # kb-tel: bind to localhost only on the host. Caddy reverse_proxies to
    # localhost:8000 so this is invisible to it. Defense in depth: blocks
    # reach from other docker bridges / processes on the VPS even if ufw is
    # misconfigured. Dev compose (base file, no overlay) keeps 0.0.0.0 for
    # LAN access from phones / pair-programming partners.
    #
    # kb-bsp: !override drops the base file's "8000:8000" entry. Compose's
    # default merge strategy for lists is concat, so without !override the
    # final container had BOTH bindings (0.0.0.0:8000 + 127.0.0.1:8000)
    # which raced and failed with "address already in use" on recreate.
    ports: !override
      - "127.0.0.1:8000:8000"
    command:
      - gunicorn
      - a_core.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --access-logfile=-
      - --error-logfile=-

  qcluster:
    restart: unless-stopped

  bot:
    restart: unless-stopped

  db:
    restart: unless-stopped
    # Forensic logging (kb-oam): csvlog captures all DDL+DML so we can
    # reconstruct attacker actions after an incident. Default log_directory
    # is `log` inside PGDATA — persisted via the bind mount below.
    #
    # BOUNDED ROTATION (2026-06-29 incident): the original config rotated by
    # age+size but used the default unique-per-rotation filename
    # (postgresql-%Y-%m-%d_%H%M%S.log), so old logs were NEVER deleted. They
    # grew to 24G over ~5 weeks, filled the 38G disk, and postgres entered a
    # "could not write lock file: No space left on device" restart loop —
    # every request 500'd for ~7 days. Fix: day-of-week filenames (%a) +
    # log_truncate_on_rotation reuse a fixed 7-name set, truncating on each
    # rotation. Hard ceiling: 7 weekdays x (.log + .csv) x 100MB ~= 1.4G,
    # independent of traffic. The size cap can truncate intra-day on a busy
    # day (losing that day's earlier lines) — an accepted tradeoff: a
    # guaranteed disk bound beats complete logs that crash the DB.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr,csvlog
      - -c
      - log_statement=mod
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=100MB
    volumes:
      - type: bind
        source: /opt/switch-berlin/db
        target: /var/lib/postgresql/data

volumes:
  postgres_data: !reset null
