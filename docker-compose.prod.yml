services:
  app:
    restart: unless-stopped
    # kb-tel: bind to localhost only on the host. Caddy reverse_proxies to
    # localhost:8000 so this is invisible to it. Defense in depth: blocks
    # reach from other docker bridges / processes on the VPS even if ufw is
    # misconfigured. Dev compose (base file, no overlay) keeps 0.0.0.0 for
    # LAN access from phones / pair-programming partners.
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - gunicorn
      - a_core.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --access-logfile=-
      - --error-logfile=-

  qcluster:
    restart: unless-stopped

  bot:
    restart: unless-stopped

  db:
    restart: unless-stopped
    # Forensic logging (kb-oam): csvlog captures all DDL+DML so we can
    # reconstruct attacker actions after an incident. Default log_directory
    # is `log` inside PGDATA — persisted via the bind mount below.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr,csvlog
      - -c
      - log_statement=mod
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=100MB
    volumes:
      - type: bind
        source: /opt/switch-berlin/db
        target: /var/lib/postgresql/data

volumes:
  postgres_data: !reset null
