name: Tests

on: [push, pull_request]

# Least-privilege default. Jobs that need write access opt in per-job.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: djlint template check
        run: uv run djlint --check . --extension=html

  security:
    runs-on: ubuntu-latest
    steps:
      # Full history needed for gitleaks to scan across commits, not just the
      # tip. Shallow clones miss historic leaks.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      # gitleaks: secret scan across full git history (kb-jcg added the
      # pre-commit hook; this is the CI mirror for contributors who skip the
      # pre-commit install step). Pinned to v8.30.1 via tarball download —
      # avoids needing the Go toolchain on the runner. --redact prevents
      # leaked secrets from being printed in CI logs (they're already-leaked,
      # but no need to amplify).
      - name: gitleaks secret scan
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/ gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact

      # bandit: static analysis for Python security antipatterns. Gated on HIGH
      # severity HIGH confidence (-lll -iii) — lower tiers are noisy and would
      # gate the PR on false positives. Current baseline is zero findings at
      # this threshold (kb-nsb annotated the one legitimate HIGH).
      - name: bandit static analysis
        run: uvx bandit -r . -lll -iii --exclude=./.venv,./node_modules,./staticfiles,./static

      # pip-audit: scan resolved deps against the PyPI advisory DB. Runs against
      # the locked requirements so the gate fires on new CVEs the moment they're
      # disclosed against a pinned version. Project deps only (--no-dev) — dev
      # tooling CVEs are noise here.
      - name: pip-audit (CVE scan)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt > /tmp/reqs.txt
          uvx --python 3.13 pip-audit -r /tmp/reqs.txt

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SECRET_KEY: ci-insecure-key-for-testing-only
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      LOGFIRE_TOKEN: ""
      # PUBLIC_READ_ENABLED is a DB-backed FeatureFlag, seeded True by migration
      # 0003 — NOT an env var — so the system checks fire once `migrate` runs.
      # E006/E007 (a_core/checks.py) are deliberate fail-loud public-read guards
      # (ADR-008 D3); the correct fix is to satisfy them with dummy non-prod
      # values, NOT to weaken the checks. Real operator identity is set from GH
      # secrets in prod. Turnstile values are Cloudflare's documented always-pass
      # test keys (https://developers.cloudflare.com/turnstile/troubleshooting/testing/).
      IMPRESSUM_NAME: "CI Test Operator"
      IMPRESSUM_ADDRESS: "Test Street 1, 10000 Test City"
      IMPRESSUM_EMAIL: "ci-test@example.com"
      TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install gettext (for makemessages)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run python manage.py migrate

      # .mo files are gitignored, so compile the committed .po before pytest —
      # the takedown DE translation tests assert German strings that gettext can
      # only return from a compiled catalog. gettext is installed above.
      - name: Compile translations
        run: uv run python manage.py compilemessages --locale=de

      - name: pytest
        run: uv run pytest

      - name: makemigrations check (no unapplied migrations)
        run: uv run python manage.py makemigrations --check --dry-run

      # check --deploy under prod-shaped env (kb-eqr). Catches DEBUG=True
      # regressions, missing CSRF_TRUSTED_ORIGINS, etc. before merge.
      # --fail-level WARNING is strict; W005 + W021 are silenced in settings.py
      # because both reflect the intentional HSTS-soak strategy.
      - name: check --deploy (production safety gate)
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: "switch.berlin,www.switch.berlin"
          CSRF_TRUSTED_ORIGINS: "https://switch.berlin,https://www.switch.berlin"
          # Long-enough SECRET_KEY so security.W009 (key length < 50) doesn't
          # trip the WARNING gate. Test value only; prod is set from GH secret.
          SECRET_KEY: "ci-only-deploy-check-secret-key-with-enough-entropy-for-w009"
          # This fast pre-merge gate runs without a frontend build, so the Vite
          # manifest is absent and django_vite.W001 would trip --fail-level
          # WARNING — a false positive here, since this gate exists to catch
          # settings regressions, not missing build artifacts. Prod can't hit a
          # missing manifest: the Dockerfile frontend stage builds it into the
          # image. Silencing W001 here only (never in prod) keeps that real.
          CI_SKIP_VITE_MANIFEST_CHECK: "True"
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: makemessages check (i18n catalog not empty)
        run: |
          uv run python manage.py makemessages -l de
          if ! grep -q '^msgid ' locale/de/LC_MESSAGES/django.po; then
            echo 'ERROR: locale/de/LC_MESSAGES/django.po is empty — add {% trans %} tags to templates'
            exit 1
          fi
