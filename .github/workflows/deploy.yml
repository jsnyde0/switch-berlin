name: deploy

# Production deploy workflow for switch.berlin (kb-6nq.5).
#
# Pulls main into /opt/switch-berlin/app on the VPS, renders .env from GH
# Secrets, builds + brings up the compose stack, applies migrations, runs
# check --deploy, and triggers a backup to populate the timer's LAST column.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALLOWED_HOSTS: switch.berlin,www.switch.berlin
  CSRF_TRUSTED_ORIGINS: https://switch.berlin,https://www.switch.berlin
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: a_core.settings

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Setup SSH client
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull triggering SHA into /opt/switch-berlin/app
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" "DEPLOY_SHA=${DEPLOY_SHA} bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/switch-berlin/app
          if [ ! -d .git ]; then
            git clone https://github.com/jsnyde0/switch-berlin.git .
          fi
          git fetch --prune origin "${DEPLOY_SHA}"
          git reset --hard "${DEPLOY_SHA}"
          echo "deployed-sha=$(git rev-parse --short HEAD)"
          EOF

      - name: Render /opt/switch-berlin/app/.env on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMPRESSUM_NAME: ${{ secrets.IMPRESSUM_NAME }}
          IMPRESSUM_ADDRESS: ${{ secrets.IMPRESSUM_ADDRESS }}
          IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}
          IMPRESSUM_PHONE: ${{ secrets.IMPRESSUM_PHONE }}
          RESPONSIBLE_PERSON_NAME: ${{ secrets.RESPONSIBLE_PERSON_NAME }}
          RESPONSIBLE_PERSON_ADDRESS: ${{ secrets.RESPONSIBLE_PERSON_ADDRESS }}
          DSA_CONTACT_EMAIL: ${{ secrets.DSA_CONTACT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          umask 077
          # Derive POSTGRES_PASSWORD from DATABASE_URL so one secret rotation
          # (kb-vb7) propagates to both the connection URL and postgres init.
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "ERROR: DATABASE_URL must start with postgres:// or postgresql:// (got prefix: ${DATABASE_URL:0:12})" >&2
              exit 1
              ;;
          esac
          # sed -n + p flag: print only on successful substitution, empty on miss.
          POSTGRES_PASSWORD=$(printf '%s' "$DATABASE_URL" | sed -nE 's|^postgres(ql)?://[^:]+:([^@]+)@.*|\2|p')
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "ERROR: could not extract password from DATABASE_URL (regex miss)" >&2
            exit 1
          fi
          tmpfile=$(mktemp)
          {
            printf 'ENVIRONMENT=production\n'
            printf 'DEBUG=%s\n' "$DEBUG"
            printf 'ALLOWED_HOSTS=%s\n' "$ALLOWED_HOSTS"
            printf 'CSRF_TRUSTED_ORIGINS=%s\n' "$CSRF_TRUSTED_ORIGINS"
            printf 'DJANGO_SETTINGS_MODULE=%s\n' "$DJANGO_SETTINGS_MODULE"
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'POSTGRES_DB=postgres\n'
            printf 'POSTGRES_USER=postgres\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'IMPRESSUM_NAME=%s\n' "$IMPRESSUM_NAME"
            printf 'IMPRESSUM_ADDRESS=%s\n' "$IMPRESSUM_ADDRESS"
            printf 'IMPRESSUM_EMAIL=%s\n' "$IMPRESSUM_EMAIL"
            printf 'IMPRESSUM_PHONE=%s\n' "$IMPRESSUM_PHONE"
            printf 'RESPONSIBLE_PERSON_NAME=%s\n' "$RESPONSIBLE_PERSON_NAME"
            printf 'RESPONSIBLE_PERSON_ADDRESS=%s\n' "$RESPONSIBLE_PERSON_ADDRESS"
            printf 'DSA_CONTACT_EMAIL=%s\n' "$DSA_CONTACT_EMAIL"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'FIRECRAWL_API_KEY=%s\n' "$FIRECRAWL_API_KEY"
          } > "$tmpfile"
          scp -i ~/.ssh/deploy_key "$tmpfile" "${VPS_USER}@${VPS_HOST}:/opt/switch-berlin/app/.env"
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'chmod 600 /opt/switch-berlin/app/.env'
          rm -f "$tmpfile"

      - name: Build image and start db
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'EOF'
          set -euxo pipefail
          cd /opt/switch-berlin/app
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          $COMPOSE build app
          $COMPOSE up -d db
          for i in $(seq 1 30); do
            if $COMPOSE exec -T db pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          EOF

      - name: Self-heal postgres role password
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # Realign pg_authid with DATABASE_URL secret. PGDATA persists across
          # deploys via the prod-overlay bind mount, so if the GH secret changes
          # the role password drifts (kb-3w6). 'host all all 127.0.0.1/32 trust'
          # in pg_hba.conf lets us reset without knowing the current password.
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'EOF'
          set -euxo pipefail
          cd /opt/switch-berlin/app
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          # sed -n + p flag: prints only on successful substitution. Without -n,
          # sed echoes the input unchanged on a no-match, leaving DB_PASS set to
          # garbage and the -z guard never firing (kb-vb7 incident, 2026-05-13).
          DB_PASS=$(grep '^DATABASE_URL=' .env | sed -nE 's|^DATABASE_URL=postgres(ql)?://[^:]+:([^@]+)@.*|\2|p')
          if [ -z "${DB_PASS:-}" ]; then
            echo "ERROR: could not extract password from DATABASE_URL in .env (regex miss)" >&2
            exit 1
          fi
          $COMPOSE exec -T db psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER USER postgres WITH PASSWORD '${DB_PASS//\'/\'\'}'" >/dev/null
          EOF

      - name: Recreate app + run migrations + check --deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # --force-recreate: docker compose's image-change detection has missed
          # rebuilds before (new templates baked into image, but compose kept the
          # running container on the old layer). Force a fresh container so the
          # new code actually lands on prod.
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'EOF'
          set -euxo pipefail
          cd /opt/switch-berlin/app
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          $COMPOSE up -d --remove-orphans --force-recreate
          for i in $(seq 1 30); do
            if $COMPOSE exec -T app true 2>/dev/null; then
              break
            fi
            sleep 2
          done
          $COMPOSE exec -T app python manage.py migrate --no-input
          $COMPOSE exec -T app python manage.py migrate --check
          $COMPOSE exec -T app python manage.py check --deploy
          $COMPOSE ps
          EOF

      - name: Trigger kb-backup (populates timer LAST)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" 'sudo systemctl start kb-backup.service && sudo systemctl status --no-pager -n 20 kb-backup.service || true'
