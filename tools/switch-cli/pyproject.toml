[project]
name = "switch-cli"
version = "0.1.0"
description = "Switch syndication CLI — agent-shaped REST client for the Switch HTTP API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.1",
    "httpx>=0.28.1",
    "telethon>=1.43.2",
    "tomli-w>=1.2.0",
]

[project.scripts]
switch-cli = "switch_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switch_cli"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
