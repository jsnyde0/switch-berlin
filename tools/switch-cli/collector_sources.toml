# Track A collector source list (sb-7wzb.2, ratified by the user 2026-09-28/29).
#
# shape       = RawMessage.source_type the rows land with; it derives the tier
#               (ADR-012 D2): website / telegram_telethon (public channel, group
#               or forum topic) land public; telegram_private_channel and
#               telegram_private_group land semi_public.
# publish     = the per-source collector switch: false = collect-only (rows and
#               drafts, never published).
# default_organizer = who organizes a post that does not name its own organizer
#               (ADR-007 D9; an explicit organizer in the post always wins):
#               a Profile name (must exist, directly or as the winner of a
#               staff merge; else the row fails) = the source IS that
#               organizer's own site or channel; "poster" = a
#               community board, the post's author (their Telegram display
#               name) organizes it; unset = hold the row for review. Channel
#               titles are never used as names.
# chat        = @username for public Telegram sources, else the dialog title
#               (case-insensitive substring; must match exactly one dialog).
# topic       = forum topic title (substring) for forum sources.
# venue       = the source's default venue (Venue name, merge-aware): an event whose
#               post names no place and no placeholder lands there.
# venue_run_by = the Profile (name, merge-aware) that runs that venue; set on the
#               venue when it has none. The profile must exist; venues never
#               create profiles.
#
# Seeding: collection never creates a config-named profile or venue (a typo
# must not make a public one). On a fresh database run
#     uv run python manage.py seed_collector_sources
# (idempotent; resolves merged-away names to the winner; prints what it created).
# collect-nightly.sh runs it before collecting.

[[source]]
name = "IKSK program page"
shape = "website"
parser = "iksk"
url = "https://iksk-berlin.de/Program"
default_organizer = "IKSK Berlin"
venue = "IKSK Berlin (Holzmarkt 25, Haus 2)"
venue_run_by = "IKSK Berlin"
publish = true

