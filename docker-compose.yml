services:
  # One-shot bootstrap: runs migrate + createsuperuser + collectstatic once on
  # 'docker compose up'. Skipped automatically on 'docker compose run --rm app'
  # because 'app' does not depend on this service.
  init:
    build: .
    image: switch-app
    env_file: .env
    entrypoint: ["/app/bin/init.sh"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: switch-app
    env_file: .env
    ports:
      # 0.0.0.0 in dev so the dev server is reachable from phones / pair-
      # programming partners on the LAN. The prod overlay
      # (docker-compose.prod.yml) overrides this with 127.0.0.1:8000:8000 for
      # defense in depth on the public VPS.
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  qcluster:
    image: switch-app
    env_file: .env
    entrypoint: ["python", "manage.py", "qcluster"]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  bot:
    image: switch-app
    env_file: .env
    entrypoint: ["python", "manage.py", "run_bot"]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # :? fails compose-up loudly if unset — prevents fresh PGDATA init from creating role with a hardcoded password (kb-rco wipe vector).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 1s
      retries: 5

volumes:
  postgres_data:
