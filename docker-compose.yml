services:
  # One-shot bootstrap: runs migrate + createsuperuser + collectstatic once on
  # 'docker compose up'. Skipped automatically on 'docker compose run --rm app'
  # because 'app' does not depend on this service.
  init:
    build: .
    image: switch-app
    env_file: .env
    entrypoint: ["/app/bin/init.sh"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: switch-app
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  qcluster:
    image: switch-app
    env_file: .env
    entrypoint: ["python", "manage.py", "qcluster"]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  bot:
    image: switch-app
    env_file: .env
    entrypoint: ["python", "manage.py", "run_bot"]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 1s
      retries: 5

volumes:
  postgres_data:
