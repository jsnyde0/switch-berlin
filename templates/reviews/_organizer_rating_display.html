{% load i18n %}
<div id="organizer-rating-display" class="flex flex-col gap-2">
  {% if rating_count >= MIN_RATINGS_FOR_DISPLAY %}
    <p class="kb-display text-[22px] leading-none font-light tracking-tight text-base-content">
      {{ avg_rating|floatformat:1 }}
      <span class="text-base-content/30">/ 5</span>
      <span class="kb-mono ml-3 text-[10px] uppercase tracking-[0.22em] text-base-content/45 normal-case">
        ({{ rating_count }} {% trans "reviews" %})
      </span>
    </p>
  {% endif %}
  <p class="kb-mono text-[10px] uppercase tracking-[0.22em] text-emerald-300">
    — {% trans "Your review has been saved" %} —
  </p>
</div>
