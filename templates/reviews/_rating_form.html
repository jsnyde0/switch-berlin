{% load i18n %}
{% if submitted %}
<p class="text-sm text-success">{% trans "Review submitted. Thank you!" %}</p>
{% elif error %}
<p class="text-sm text-error">{{ error }}</p>
{% else %}
<form id="{{ form_id|default:'rating-form' }}"
      hx-post="{% url 'review-submit' %}"
      hx-target="#{{ form_id|default:'rating-form' }}"
      hx-swap="outerHTML">
  {% csrf_token %}
  <input type="hidden" name="target_type" value="{{ target_type }}">
  <input type="hidden" name="target_id" value="{{ target_id }}">
  <fieldset class="flex flex-col gap-2">
    <legend class="text-sm font-medium">{% trans "Rate this" %}</legend>
    <div class="rating" role="radiogroup" aria-label="{% trans 'Rating' %}">
      {% for i in "12345" %}
      <input type="radio" name="rating" value="{{ i }}"
             class="mask mask-star-2 bg-orange-400"
             {% if user_rating == i %}checked{% endif %}
             aria-label="{{ i }} {% trans 'stars' %}">
      {% endfor %}
    </div>
    <textarea name="body" class="textarea textarea-bordered textarea-sm w-full"
              placeholder="{% trans 'Optional comment...' %}" rows="2"></textarea>
    <button type="submit" class="btn btn-sm btn-outline">{% trans "Submit review" %}</button>
  </fieldset>
</form>
{% endif %}
