{% load i18n %}
{{ markers_geojson|json_script:"markers-data" }}

<div x-data="{}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  {% for event in page_obj %}
    <div data-event-slug="{{ event.organizer.slug }}/{{ event.slug }}"
         class="cursor-pointer"
         :class="$store.map.hoveredEventId === '{{ event.organizer.slug }}/{{ event.slug }}' ? 'ring-2 ring-indigo-400 rounded-lg' : ''"
         onclick="Alpine.store('map').selectEvent('{{ event.organizer.slug }}/{{ event.slug }}')"
         @mouseenter="$store.map.hoverEvent('{{ event.organizer.slug }}/{{ event.slug }}')"
         @mouseleave="$store.map.hoverEvent(null)">
      <c-event-card :event="event" :going_venue_id_list="going_venue_id_list" />
    </div>
  {% empty %}
    <p class="col-span-full text-base-content/60">{% trans "No events found." %}</p>
  {% endfor %}
</div>

<c-pagination :page_obj="page_obj" />
