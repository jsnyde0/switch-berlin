{% load i18n %}
{{ markers_geojson|json_script:"markers-data" }}

<div x-data="{}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
  {% for event in page_obj %}
    <div data-event-slug="{{ event.organizer.slug }}/{{ event.slug }}"
         class="group/card cursor-pointer rounded-2xl transition-all"
         :class="$store.map.hoveredEventId === '{{ event.organizer.slug }}/{{ event.slug }}' ? 'ring-2 ring-fuchsia-400/70 ring-offset-2 ring-offset-base-100' : ''"
         onclick="if(event.target.closest('a'))return;Alpine.store('map').selectEvent('{{ event.organizer.slug }}/{{ event.slug }}');htmx.ajax('GET','/events/{{ event.organizer.slug }}/{{ event.slug }}/drawer/',{target:'#drawer',swap:'innerHTML'})"
         @mouseenter="$store.map.hoverEvent('{{ event.organizer.slug }}/{{ event.slug }}')"
         @mouseleave="$store.map.hoverEvent(null)">
      <c-event-card :event="event" :going_venue_id_list="going_venue_id_list" />
    </div>
  {% empty %}
    <div class="col-span-full flex flex-col items-center justify-center gap-3 rounded-2xl border border-dashed border-white/10 bg-base-200/30 p-12 text-center">
      <svg class="h-10 w-10 text-base-content/30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <p class="text-sm text-base-content/60">{% trans "No events match these filters." %}</p>
      <a href="?" class="text-xs font-medium text-fuchsia-300 hover:text-fuchsia-200 transition">{% trans "Clear filters" %} →</a>
    </div>
  {% endfor %}
</div>

<c-pagination :page_obj="page_obj" />
