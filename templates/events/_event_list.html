{% load i18n %}
{{ markers_geojson|json_script:"markers-data" }}

<div x-data="{}" class="grid grid-cols-1 lg:grid-cols-2 gap-x-8 gap-y-0">
  {% for event in page_obj %}
    <div data-event-slug="{{ event.organizer.slug }}/{{ event.slug }}"
         role="button"
         tabindex="0"
         aria-label="{% blocktrans with title=event.title %}Preview {{ title }}{% endblocktrans %}"
         class="group/card cursor-pointer rounded-2xl transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fuchsia-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-base-100"
         :class="$store.map.selectedKey === '{{ event.organizer.slug }}/{{ event.slug }}' ? 'ring-2 ring-fuchsia-400/80 ring-offset-2 ring-offset-base-100' : ($store.map.hoveredEventId === '{{ event.organizer.slug }}/{{ event.slug }}' ? 'ring-2 ring-fuchsia-400/40 ring-offset-2 ring-offset-base-100' : '')"
         onclick="if(event.target.closest('a'))return;Alpine.store('map').selectEvent('{{ event.organizer.slug }}/{{ event.slug }}');htmx.ajax('GET','/events/{{ event.organizer.slug }}/{{ event.slug }}/drawer/',{target:'#drawer',swap:'innerHTML'})"
         onkeydown="if((event.key==='Enter'||event.key===' ')&&!event.target.closest('a')){event.preventDefault();Alpine.store('map').selectEvent('{{ event.organizer.slug }}/{{ event.slug }}');htmx.ajax('GET','/events/{{ event.organizer.slug }}/{{ event.slug }}/drawer/',{target:'#drawer',swap:'innerHTML'})}"
         @mouseenter="$store.map.hoverEvent('{{ event.organizer.slug }}/{{ event.slug }}')"
         @mouseleave="$store.map.hoverEvent(null)">
      <c-event-card :event="event" :going_venue_id_list="going_venue_id_list" />
    </div>
  {% empty %}
    <div class="col-span-full flex flex-col items-start gap-4 border-t border-b border-white/10 py-20 px-2">
      <p class="kb-mono text-[10px] uppercase tracking-[0.22em] text-base-content/40">— {% trans "Nothing tonight" %} —</p>
      <h3 class="kb-display text-3xl font-light text-base-content/80">
        {% trans "No listings match the filter." %}
      </h3>
      <a href="?" class="kb-mono text-[11px] uppercase tracking-[0.18em] text-fuchsia-300 hover:text-fuchsia-200 transition border-b border-fuchsia-300/50 pb-0.5">{% trans "Clear filters" %} →</a>
    </div>
  {% endfor %}
</div>

<c-pagination :page_obj="page_obj" />
