{% extends "account/base_entrance.html" %}
{% load i18n %}
{% block head_title %}{% trans "Password set" %}{% endblock head_title %}
{% block content %}
  <div class="w-full max-w-md">
    <c-kb.page-header
      eyebrow="{% trans 'Account · Recovery' %}"
      title="{% trans 'Password' %}"
      accent="{% trans 'updated.' %}" />
    <p class="text-[15px] leading-[1.65] text-base-content/75 pt-2 pb-8">
      {% trans "Your password is now set. You can sign in with the new password." %}
    </p>
    <a href="{% url 'account_login' %}" class="kb-btn w-full justify-center">
      {% trans "Sign in" %}
      <span aria-hidden="true">→</span>
    </a>
  </div>
{% endblock content %}
