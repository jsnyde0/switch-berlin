{% load i18n %}
<div id="follow-{{ organizer.slug }}">
  <form hx-post="{% url 'organizer-follow' organizer.slug %}"
        hx-target="#follow-{{ organizer.slug }}"
        hx-swap="outerHTML">
    {% csrf_token %}
    {% if following %}
      <button type="submit" class="kb-btn-secondary w-full">
        <span class="kb-display-italic text-fuchsia-300/90 text-[13px] leading-none normal-case lowercase mr-1">·</span>
        {% trans "Following" %}
      </button>
    {% else %}
      <button type="submit" class="kb-btn-secondary w-full">
        {% trans "Follow" %}
        <span aria-hidden="true">+</span>
      </button>
    {% endif %}
  </form>
</div>
