{% load i18n %}
<div class="w-full pt-8 pb-16" x-data="{}">
  <div class="flex items-start justify-between mb-6 gap-6">
    <div class="min-w-0">
      <p class="kb-mono text-[10px] uppercase tracking-[0.22em] text-base-content/40 mb-1.5">
        {% trans "Post Workspace" %}
        <span class="mx-2 text-base-content/15">·</span>
        <a href="{% url 'syndication:event-hub' pk=event.pk %}"
           hx-get="{% url 'syndication:event-hub' pk=event.pk %}"
           hx-target="#studio-main"
           hx-push-url="{% url 'syndication:event-hub' pk=event.pk %}"
           class="text-base-content/40 hover:text-base-content/65 transition-colors">{{ event.title }}</a>
      </p>
      <h1 class="kb-display text-[28px] font-light leading-tight">{{ post.headline }}</h1>
    </div>
  </div>
  <div class="kb-rule mb-6"></div>
  <section id="post-syndication"
           hx-get="{% url 'syndication:fragment-post-syndication' pk=post.pk %}"
           hx-trigger="load"
           hx-swap="outerHTML">
    <div class="py-10 text-base-content/30 kb-mono text-[11px] uppercase tracking-widest text-center">
      {% trans "Loading post workspace…" %}
    </div>
  </section>
</div>
