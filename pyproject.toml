[project]
name = "kinky-bubbles"
version = "0.1.0"
description = "Berlin queer/kinky/conscious events aggregator — Django + HTMX + React island."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core Django
    "django>=5.2",
    "dj-database-url>=3.0",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "pillow>=11.2",
    # Auth
    "django-allauth>=65.8",
    # Frontend seams
    "django-htmx>=1.22",
    "django-cotton>=2.1",
    "django-template-partials>=25.1",
    "django-vite>=3.1",
    # Background jobs (Postgres ORM broker, no Redis)
    "django-q2>=1.8",
    # Ingestion / LLM
    "pydantic-ai>=0.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "markdownify>=0.14",
    "python-telegram-bot>=21.10",
    # Vector search
    "pgvector>=0.3",
    # Observability
    "logfire>=3.0",
    # Dev / debug
    "debugpy>=1.8",
    "django-debug-toolbar>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "ruff>=0.9",
    "djlint>=1.36",
    "pre-commit>=4.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".git", ".venv", "__pycache__", "**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
profile = "django"
indent = 2

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "a_core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
markers = [
    "agentic: marks tests that hit an LLM (deselect with '-m \"not agentic\"')",
]
addopts = "-m 'not agentic'"
