[project]
name = "switch"
version = "0.1.0"
description = "Berlin queer/kinky/conscious events aggregator — Django + HTMX + React island."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core Django
    "django>=6.0.5",
    "dj-database-url>=3.0",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "pillow>=11.2",
    # Auth
    "django-allauth>=65.8",
    # Frontend seams
    "django-htmx>=1.22",
    "django-cotton>=2.1",
    "django-vite>=3.1",
    # Background jobs (Postgres ORM broker, no Redis)
    "django-q2>=1.8",
    "croniter>=6.0",  # required by django-q2 for Schedule.CRON type
    # Ingestion / LLM
    "pydantic-ai>=1.99.0",
    # Transitive CVE floors (pydantic-ai tree doesn't pull patched versions automatically):
    # PYSEC-2026-161: starlette<1.0.1 (via pydantic-ai -> mcp/fastmcp)
    "starlette>=1.0.1",
    # PYSEC-2026-175/177/178/179: pyjwt<2.13.0 (via pydantic-ai -> mcp -> fastmcp)
    "pyjwt>=2.13.0",
    # CVE-2026-42561: python-multipart<0.0.27 (via pydantic-ai -> mcp -> fastmcp)
    "python-multipart>=0.0.27",
    # PYSEC-2026-141/142: urllib3<2.7.0 (transitive via httpx/requests)
    "urllib3>=2.7.0",
    # CVE-2026-45409: idna<3.15 (transitive)
    "idna>=3.15",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "markdownify>=0.14",
    "python-telegram-bot>=21.10",
    # Vector search
    "pgvector>=0.3",
    # Rate limiting
    "django-ratelimit>=4.1",
    # Observability
    "logfire>=3.0",
    # Dev / debug
    "debugpy>=1.8",
    "django-debug-toolbar>=5.1",
    "django-ninja>=1.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "ruff>=0.9",
    "djlint>=1.36",
    "pre-commit>=4.1",
]

[tool.ruff]
# 120 (not Black's 88): the codebase's test asserts + descriptive docstrings run long;
# 88 produced ~680 line-too-long errors almost entirely from legitimate test prose. See kb-f17n.
line-length = 120
target-version = "py313"
# tools/ holds self-contained uv sub-projects (e.g. switch-cli) with their own env;
# the root lint must not gate on them, mirroring the existing pytest --ignore=tools in addopts.
# CI strategy for switch-cli is tracked separately (kb-slzj).
exclude = [".git", ".venv", "__pycache__", "**/migrations/*", "**/test_migrations/*", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
profile = "django"
indent = 2

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "a_core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
markers = [
    "agentic: marks tests that hit an LLM (deselect with '-m \"not agentic\"')",
    "slow: marks tests as slow (e.g. makemessages, heavy DB operations)",
]
# --ignore=tools: tools/ holds self-contained uv sub-projects (e.g. switch-cli)
# with their own .venv/pyproject; the root Django suite must not collect them
# (they'd fail at import — switch_cli isn't installed in the root env). They run
# in their own context. See kb-33do.6.
addopts = "-m 'not agentic and not slow' --ignore=tools"
