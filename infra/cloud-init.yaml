#cloud-config
# Cloud-init for Switch Berlin production VPS (kb-6nq.1).
# Idempotent first-boot config: deploy user, Docker, Caddy, firewall, app dirs.

users:
  - name: switch
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMszTrmxyJRH2d8pe3BsJH3gJ8OzaC3Os3U+8dcqgSfu jonatansnyders@gmail.com

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/caddy/Caddyfile
    permissions: "0644"
    owner: root:root
    # Mirror of infra/Caddyfile. Deploy workflow (.github/workflows/deploy.yml)
    # pushes infra/Caddyfile on every deploy, so this content is only canonical
    # at first-boot; keep it aligned anyway so fresh provisions are secure.
    content: |
      switch.berlin {
      	encode zstd gzip

      	header {
      		X-Content-Type-Options "nosniff"
      		X-Frame-Options "DENY"
      		Referrer-Policy "strict-origin-when-cross-origin"
      		Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      		Cross-Origin-Resource-Policy "same-site"
      		X-DNS-Prefetch-Control "off"
      		-Server
      	}

      	reverse_proxy localhost:8000
      }

      www.switch.berlin {
      	redir https://switch.berlin{uri} 308
      }

  # sshd_config drop-in: explicit policy beyond ssh_pwauth (which only sets
  # PasswordAuthentication, not the related KbdInteractive/PermitRootLogin).
  # Drop-in style survives distro sshd_config regenerations.
  - path: /etc/ssh/sshd_config.d/99-switch.conf
    permissions: "0644"
    owner: root:root
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no

  # fail2ban sshd jail: rate-limit failed SSH auth at the firewall layer.
  # bantime=1h, findtime=10m, maxretry=5 — conservative defaults that don't
  # lock out a fat-fingered operator while killing automated scanners.
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    owner: root:root
    content: |
      [sshd]
      enabled = true
      port = ssh
      bantime = 3600
      findtime = 600
      maxretry = 5
      # banaction=ufw keeps bans in ufw state. Default iptables-multiport
      # rules live in INPUT and get flushed by `ufw --force enable`; ufw
      # banaction integrates cleanly with the already-configured firewall.
      banaction = ufw

  # unattended-upgrades: apply security-channel updates automatically. Default
  # Ubuntu 24.04 config already targets *-security only; this file just enables
  # the periodic-update timer + unattended-upgrade itself.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    owner: root:root
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # --- Caddy system user (the .deb postinst is unreliable on Ubuntu 24.04 — pre-create) ---
  - getent group caddy >/dev/null || groupadd --system caddy
  - id caddy >/dev/null 2>&1 || useradd --system --gid caddy --create-home --home-dir /var/lib/caddy --shell /usr/sbin/nologin --comment "Caddy web server" caddy
  # --- Docker (official repo) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release; echo $VERSION_CODENAME) stable" \
      > /etc/apt/sources.list.d/docker.list
  # --- Caddy (cloudsmith repo) ---
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin caddy
  # --- App dirs ---
  - install -d -o switch -g switch -m 0755 /opt/switch-berlin
  - install -d -o switch -g switch -m 0755 /opt/switch-berlin/app
  - install -d -o switch -g switch -m 0755 /opt/switch-berlin/db
  # --- Firewall ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  # --- Services ---
  - systemctl enable --now docker
  - systemctl reload caddy || systemctl restart caddy
  - systemctl enable --now fail2ban
  - systemctl enable --now unattended-upgrades
  - systemctl reload ssh || systemctl reload sshd || true
  - touch /var/lib/cloud/instance/cloud-init.done

ssh_pwauth: false

power_state:
  mode: reboot
  condition: false
